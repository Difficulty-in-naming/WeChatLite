[package]
name = "wechat-p2p"
version = "0.1.0"
edition = "2024"

[lib]
name = "wechat_p2p"
# The Android client loads this crate in-process through JNI; the desktop helper still builds the
# `wechat-link` binary from main.rs.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "wechat-link"
path = "src/main.rs"

[dependencies]
anyhow = "1"
futures-util = "0.3"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring", "portmapper", "fast-apple-datapath"] }
iroh-relay = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal"] }
url = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["process"] }
iroh-relay = { version = "=1.3.0", default-features = false, features = ["server", "tls-ring"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
sha2 = "0.10"
