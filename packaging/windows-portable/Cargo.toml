[package]
name = "wechat-portable"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
autotests = false

[workspace]

[[bin]]
name = "portable-launcher"
path = "src/main.rs"

[[bin]]
name = "portable-pack"
path = "src/pack.rs"

[[bin]]
name = "portable-fixture"
path = "tests/fixture.rs"

[[test]]
name = "security"
path = "tests/security.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
