name: macOS arm64 packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare native tools and Qt
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
          python3 -m pip install --disable-pip-version-check aqtinstall==3.3.0 cmake==3.31.6
          python3 -m aqt install-qt mac desktop 6.8.3 clang_64 \
            --archives qtbase qtsvg qttools --modules qtwebsockets --outputdir "$PWD/.qt"
          echo "QT_PREFIX=$PWD/.qt/6.8.3/macos" >> "$GITHUB_ENV"
          cargo --version
          cmake --version
      - name: Build, test and package
        shell: bash
        run: bash scripts/build-macos.sh
      - name: Save distributable packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macOS-arm64-packages
          path: |
            dist/WeChatLite-*-macOS-arm64.dmg
            dist/MACOS_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: Save test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macOS-test-diagnostics
          path: |
            build-macos/Testing/Temporary/LastTest.log
            build-macos/client/*-tests.txt
            build-macos/server_gui/*-tests.txt
          if-no-files-found: ignore
          retention-days: 7
